<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>N315 — Drive Storage 3 Tests</title><style>body{margin:0;background:#f4f6fb;color:#17243a;font:15px system-ui,sans-serif;padding:28px}main{max-width:700px;margin:auto;background:#fff;padding:26px;border-radius:14px;box-shadow:0 4px 24px #0001}button{background:#245dca;border:0;border-radius:8px;color:white;padding:12px 18px;cursor:pointer}button:disabled{opacity:.55}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f4f9;border-radius:9px;padding:16px}a{color:#245dca}.muted{color:#596678}h1{font-size:22px}</style></head><body><main><h1>N315 — Google Drive Storage: 3 Tests</h1><p>প্রথমে <a href="./index.html">Personal Portal</a>-এ Login করুন। এরপর এখানে ফিরে পরীক্ষা চালান।</p><button id="run" disabled>Loading...</button><p class="muted">পরীক্ষা: ping → create_test → read_test। শুধু Test File তৈরি হবে। কোনো Password বা Token দেখানো হবে না।</p><pre id="result" role="status" aria-live="polite">অপেক্ষা করছে...</pre><p><a href="./index.html">← Portal-এ ফিরে যান</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{'use strict';const URL='https://oiaudmzrwtaljkcwbooi.supabase.co',KEY='sb_publishable_IHsq14XmgVhe9J8taquEkg_n_TCiDVn',btn=document.getElementById('run'),out=document.getElementById('result');const display=x=>out.textContent=JSON.stringify(x,null,2);if(!window.supabase){display({result:'ERROR',reason:'Supabase JS library did not load'});return;}const client=window.supabase.createClient(URL,KEY,{auth:{detectSessionInUrl:false,persistSession:true,autoRefreshToken:true}});btn.disabled=false;btn.textContent='Run 3 Storage Tests';btn.addEventListener('click',async()=>{btn.disabled=true;const results=[];try{const {data,error}=await client.auth.getSession();if(error||!data?.session?.access_token){display({result:'NOT_LOGGED_IN',next:'Portal-এ Login করে ফিরে আসুন'});return;}for(const [action,expected] of [['ping','DRIVE_BRIDGE_READY'],['create_test','TEST_NOTE_SAVED'],['read_test','TEST_NOTE_READ']]){display({result:'RUNNING',current:action,completed:results});let res,payload;try{res=await fetch(URL+'/functions/v1/portal-drive-storage',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+data.session.access_token},body:JSON.stringify({action}),cache:'no-store'});payload=await res.json();}catch(e){results.push({action,result:'FAIL',code:'NETWORK_OR_NON_JSON'});break;}const passed=res.status===200&&payload.ok===true&&payload.code===expected&&(action!=='read_test'||payload.contentVerified===true);results.push({action,result:passed?'PASS':'FAIL',httpStatus:res.status,code:payload.code||'UNKNOWN',bridgeCode:payload.bridgeCode||undefined,contentVerified:action==='read_test'?payload.contentVerified:undefined});if(!passed)break;}display({result:results.length===3&&results.every(x=>x.result==='PASS')?'PASS':'FAIL',tests:results});}catch(e){display({result:'ERROR',reason:'Test could not complete'});}finally{btn.disabled=false;}});})();
</script></body></html>
