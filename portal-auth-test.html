<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>N298 — Portal Valid Login Test</title><style>body{font:16px system-ui;background:#f5f7fb;color:#172033;margin:0;padding:30px}main{max-width:650px;margin:auto;background:white;padding:28px;border-radius:16px;box-shadow:0 5px 25px #0001}button{background:#205cc8;color:white;border:0;border-radius:8px;padding:12px 20px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f4f8;padding:14px;border-radius:8px}a{color:#205cc8}.hint{color:#576477}</style></head><body><main><h2>N298 — Valid Login Verification</h2><p>প্রথমে <a href="./index.html">Personal Portal</a>-এ Login করুন। তারপর এই পেজে এসে বোতাম চাপুন।</p><button id="run" disabled>Loading...</button><p class="hint">কোনো Password, Access Token বা Secret দেখানো বা সংরক্ষণ করা হবে না।</p><pre id="result" role="status" aria-live="polite">অপেক্ষা করছে...</pre><p><a href="./index.html">← Portal-এ ফিরে যান</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{'use strict';const URL='https://oiaudmzrwtaljkcwbooi.supabase.co';const KEY='sb_publishable_IHsq14XmgVhe9J8taquEkg_n_TCiDVn';const btn=document.getElementById('run'),out=document.getElementById('result');const show=x=>out.textContent=JSON.stringify(x,null,2);if(!window.supabase){show({result:'ERROR',reason:'Supabase JS library did not load'});return;}const client=window.supabase.createClient(URL,KEY,{auth:{detectSessionInUrl:false,persistSession:true,autoRefreshToken:true}});btn.disabled=false;btn.textContent='Run Valid Login Test';btn.addEventListener('click',async()=>{btn.disabled=true;show({result:'RUNNING'});try{const {data,error}=await client.auth.getSession();if(error||!data?.session?.access_token){show({result:'NOT_LOGGED_IN',next:'Portal-এ Login করে এই পেজে ফিরে আসুন'});return;}const response=await fetch(URL+'/functions/v1/portal-drive-auth-check',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+data.session.access_token},body:'{}',cache:'no-store'});let payload;try{payload=await response.json();}catch{payload={code:'NON_JSON_RESPONSE'};}show({result:response.status===200&&payload.ok===true&&payload.code==='AUTH_VERIFIED'?'PASS':'FAIL',httpStatus:response.status,code:payload.code||'UNKNOWN',verified:payload.ok===true,checkedAt:payload.checkedAt||null});}catch(e){show({result:'ERROR',reason:e instanceof TypeError?'Network or CORS error':'Request failed'});}finally{btn.disabled=false;}});})();
</script></body></html>
