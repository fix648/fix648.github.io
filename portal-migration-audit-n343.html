<!doctype html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>N339 — Offline Restore Verification</title><style>body{font:15px/1.6 system-ui;max-width:780px;margin:25px auto;padding:0 18px}input,button{padding:10px;margin:7px 0}input[type=password]{width:95%;max-width:440px}button{background:#225aca;color:white;border:0;border-radius:5px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f0f3f8;padding:16px}</style><h2>N343 — Migration Preflight Audit</h2><p>এই পরীক্ষা সম্পূর্ণ Browser-এর ভিতরে হবে। কোনো Password বা Note সার্ভারে পাঠানো হবে না। Supabase-এর ডেটাও পরিবর্তন হবে না।</p><label>Encrypted JSON File <input type="file" id="file" accept=".json,application/json"></label><p><label>Backup Password <input type="password" id="pass" autocomplete="off"></label></p><button id="check">Audit Migration Readiness</button><pre id="output">Ready</pre><script>
const $=id=>document.getElementById(id), dec=new TextDecoder(), enc=new TextEncoder();
function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
$('check').onclick=async()=>{ $('output').textContent='Checking...'; try {const f=$('file').files[0];if(!f)throw Error('Select backup JSON file');const w=JSON.parse(await f.text());if(w.format!=='N333_AES_256_GCM_PBKDF2'||w.version!==1||w.kdf?.hash!=='SHA-256'||w.kdf?.iterations!==310000)throw Error('Unexpected backup format/KDF');const salt=b64(w.kdf.salt),iv=b64(w.cipher.iv),ct=b64(w.cipher.data);if(salt.length!==16||iv.length!==12||ct.length<17)throw Error('Invalid encryption metadata');const raw=await crypto.subtle.importKey('raw',enc.encode($('pass').value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:w.kdf.iterations,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['decrypt']);let plaintext;try{plaintext=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct)}catch(e){throw Error('Decryption failed: wrong password or damaged file')}const d=JSON.parse(dec.decode(plaintext));if(d.format!=='N337_SCOPED_PORTAL_BACKUP')throw Error('Unexpected plaintext format');const tables=['notes','notebooks','note_locks','notebook_locks'],counts={};for(const t of tables){if(!Array.isArray(d.tables?.[t]))throw Error('Missing table '+t);counts[t]=d.tables[t].length;if(counts[t]!==d.counts?.[t])throw Error('Count mismatch: '+t)}const required=['id','title','content'];const notes=d.tables.notes;const notebookIds=new Set(d.tables.notebooks.map(n=>n.id));const missing=required.filter(k=>notes.some(n=>!(k in n)));const orphan=notes.filter(n=>n.notebook_id!=null&&!notebookIds.has(n.notebook_id)).length;const fields={};for(const t of tables){fields[t]=[...new Set(d.tables[t].flatMap(r=>Object.keys(r)))].sort();}const risks=[];if(missing.length)risks.push('Missing note fields: '+missing.join(','));if(orphan)risks.push('Notes with missing notebook: '+orphan);risks.push('N328 CRUD stores only id/title/content and does not preserve full note/notebook/lock metadata');risks.push('Current Portal app.js still reads/writes Supabase notes; production switch is NOT installed');$('output').textContent=JSON.stringify({result:'AUDIT_COMPLETE_NOT_MIGRATED',decryptVerified:true,structureVerified:true,countsVerified:true,counts,fieldNamesOnly:fields,orphanNoteReferences:orphan,risks,databaseModified:false,driveModified:false,readyForCutover:false,warning:'No migration performed; existing Supabase data remains primary.'},null,2)}catch(e){$('output').textContent=JSON.stringify({result:'FAIL',error:String(e.message||e)},null,2)}finally{$('pass').value=''}};
</script></html>
